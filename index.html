<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Jusoor — Diabetes Care Platform · منصة جسور</title>
<link rel="icon" href="./jusoor-mark.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --pri:#006C35;--pri-d:#0a4f2b;--pri-l:#0e8a47;--pri-bg:#e9f5ee;
  --teal:#1f9e8f;--teal-l:#e6f5f3;--gold:#b99441;
  --bg:#f3f6f4;--card:#fff;--line:#dfe7e2;--ink:#15291e;--muted:#64786c;
  --green:#1f9e6a;--green-bg:#e7f6ee;--amber:#d98a16;--amber-bg:#fdf2dd;
  --red:#cf4438;--red-bg:#fbe7e6;--purple:#6f4bc4;--purple-bg:#efe9fb;
  --navy:#1c3a6e;
  --shadow:0 1px 2px rgba(10,79,43,.05),0 8px 22px rgba(10,79,43,.06);--r:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--pri-d)}
button{font-family:inherit}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-variant-numeric:tabular-nums}.hidden{display:none}
/* ---------- top bar (MOH-style) ---------- */
.topbar{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--pri-d),var(--pri));color:#fff;padding:8px 18px;position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand img{height:38px;width:auto;max-width:60px;background:#fff;border-radius:8px;padding:3px 5px;object-fit:contain;display:block}
.brand .sub{font-size:10.5px;font-weight:500;opacity:.85;display:block;letter-spacing:.3px}
.envtag{background:var(--gold);color:#fff;border-radius:6px;font-size:10px;font-weight:700;padding:3px 8px;letter-spacing:.6px;text-transform:uppercase}
.topdate{font-size:11.5px;opacity:.92;line-height:1.5;text-align:center}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border-radius:9px;padding:5px 11px;font-size:12px}
.userchip .av{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--pri-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.langbtn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
.langbtn:hover{background:rgba(255,255,255,.15)}
.iconbtn{border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
.spacer{flex:1}
/* ---------- layout: sidebar + main ---------- */
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:#fff;border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;align-self:flex-start;max-height:calc(100vh - 56px);overflow:auto}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;text-align:start;margin-bottom:2px}
.navbtn .ic{width:20px;text-align:center;flex:0 0 20px}
.navbtn:hover{background:var(--bg)}
.navbtn.on{background:var(--pri);color:#fff}
.navsect{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;padding:12px 12px 6px}
main{flex:1;min-width:0}
.wrap{max-width:1220px;margin:0 auto;padding:20px 22px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);margin-top:4px}
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.side{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi .v{font-size:28px;font-weight:750;color:var(--pri-d);line-height:1}
.kpi .l{color:var(--muted);font-size:12px;margin-top:7px}
.sect-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px;font-weight:700}
[dir=rtl] .sect-t{letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.navy{background:var(--pri-bg);color:var(--pri)}.pill.grey{background:#eef1ef;color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#eef1ef;color:var(--muted);font-weight:600;white-space:nowrap}
.risk{font-weight:750;font-size:11px;padding:4px 9px;border-radius:7px;white-space:nowrap;display:inline-block}
.risk.VERY_HIGH{background:var(--red);color:#fff}.risk.HIGH{background:var(--amber);color:#fff}
.risk.MODERATE{background:#f0d27a;color:#5b4708}.risk.STABLE{background:var(--green-bg);color:var(--green)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:start;padding:9px 10px;border-bottom:1px solid var(--line)}
[dir=rtl] th{letter-spacing:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:0}
tr.clik{cursor:pointer}tr.clik:hover{background:var(--bg)}
.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:650;font-size:13px;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-l)}
.btn.gho{background:#fff;border:1px solid var(--line);color:var(--pri-d)}
.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:8px;border-radius:6px;background:#eef1ef;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:6px}
.divider{height:1px;background:var(--line);margin:13px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
label.f{display:block;font-size:12px;font-weight:650;margin:0 0 5px}
.in{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:#fff;font-family:inherit;color:var(--ink)}
.in:focus{outline:2px solid var(--pri-l);border-color:var(--pri-l)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.overlay{position:fixed;inset:0;background:rgba(10,40,25,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(960px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.mhead{background:var(--pri-d);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.mhead h2{color:#fff}
.mbody{padding:20px;max-height:72vh;overflow:auto}
.mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.x{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.ai{background:linear-gradient(180deg,#f0f7f2,#fff);border:1px solid #cfe5d6;border-radius:11px;padding:14px}
.ai .h{display:flex;align-items:center;gap:8px;font-weight:750;color:var(--pri);font-size:13px;margin-bottom:8px}
.ai ul{margin:0;padding-inline-start:18px}.ai li{margin:5px 0;font-size:13px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:3px 8px;border-radius:6px;background:var(--red-bg);color:var(--red);margin:2px 4px 2px 0}
.flag.ok{background:var(--green-bg);color:var(--green)}.flag.warn{background:var(--amber-bg);color:var(--amber)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px;line-height:1.8}
.statusdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px}
.intg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.intg:last-child{border-bottom:0}
.intg .nm{font-weight:700;min-width:150px}
/* ---------- login ---------- */
.loginbg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0a4f2b 0%,#006C35 55%,#0e8a47 100%);padding:20px}
.logincard{background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:min(440px,100%);padding:30px 30px 24px;text-align:center}
.logincard img{height:64px;margin-bottom:8px}
.loginfoot{color:rgba(255,255,255,.85);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.8;position:absolute;bottom:14px;left:0;right:0}
.ssobar{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--pri-bg);color:var(--pri-d);border-radius:9px;padding:8px;font-size:12px;font-weight:600;margin-top:14px}
@media print{.side,.topbar,.btn,.footer{display:none!important}}
</style>
</head>
<body>
<div id="loginRoot"></div>
<div id="shell" class="hidden">
  <div class="topbar">
    <div class="brand">
      <img src="./jusoor-logo.png" alt="Jusoor" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='./jusoor-mark.svg'}"/>
      <span><span id="brandName">JUSOOR · جسور</span><span class="sub" id="brandSub"></span></span>
    </div>
    <span class="envtag" id="envTag"></span>
    <div class="spacer"></div>
    <div class="topdate" id="topDate"></div>
    <button class="langbtn" id="langBtn" onclick="toggleLang()"></button>
    <div class="userchip" id="userChip"></div>
    <button class="iconbtn" onclick="logout()" id="logoutBtn"></button>
  </div>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main>
      <div class="wrap">
        <div id="app"></div>
        <div class="card" style="margin-top:16px"><div class="between" style="flex-wrap:wrap;gap:10px">
          <span class="muted small" id="dataNote"></span>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn gho sm" onclick="exportJSON()" id="btnExport"></button>
            <button class="btn gho sm" onclick="document.getElementById('imp').click()" id="btnImport"></button>
            <button class="btn gho sm" onclick="resetPanel()" id="btnReset"></button>
            <input id="imp" type="file" accept="application/json" class="hidden" onchange="importJSON(event)"/>
          </div>
        </div></div>
      </div>
      <div class="footer" id="footNote"></div>
    </main>
  </div>
</div>
<div id="modalRoot"></div>

/* ====================== RISK ENGINE (medication-aware, guideline-mapped) ====================== */
function num(v,d){const n=parseFloat(v);return Number.isFinite(n)?n:(d||0);}
function computeRisk(p){
  const F=[],PR=[],gaps=[];
  const add=(l,w)=>{if(w>0)F.push({l,w});};
  const prot=(l,w)=>PR.push({l,w});
  const gap=(code,text,sev,ar)=>gaps.push({code,text,sev:sev||'HIGH',ar});
  const cls=new Set((p.meds||[]).map(m=>m.cls));
  const hasAny=a=>a.some(c=>cls.has(c));
  const acr=num(p.acr),egfr=p.egfr==null?null:num(p.egfr),egfrPrev=num(p.egfrPrev,egfr||0);
  const tr=p.hba1cTrend&&p.hba1cTrend.length?p.hba1cTrend:[num(p.hba1c)];
  const hba1c=num(p.hba1c,tr[tr.length-1]);
  const cm=new Set(p.comorbidities||[]);
  const ckd=cm.has('CKD')||(egfr&&egfr<60);
  const prot_uria=acr>=30;
  if(hba1c>=9)add('HbA1c '+hba1c+'% (high)',.22);else if(hba1c>=8)add('HbA1c '+hba1c+'% (elevated)',.12);else if(hba1c>=7)add('HbA1c '+hba1c+'% (above target)',.05);
  const vel=tr.length>=2?tr[tr.length-1]-tr[0]:0;
  if(vel>=1)add('HbA1c rising +'+vel.toFixed(1)+'%',.18);else if(vel>=.4)add('HbA1c trending up +'+vel.toFixed(1)+'%',.09);
  if(acr>=300)add('Macroalbuminuria ACR '+acr,.18);else if(acr>=30)add('Albuminuria ACR '+acr,.11);
  if(egfr&&egfr<30)add('eGFR '+egfr+' (severe)',.22);else if(egfr&&egfr<45)add('eGFR '+egfr+' (CKD 3b)',.16);else if(egfr&&egfr<60)add('eGFR '+egfr+' (reduced)',.08);
  if(egfr&&(egfrPrev-egfr)>=10)add('eGFR fell '+(egfrPrev-egfr).toFixed(0),.10);
  const sbp=num(p.sbp),dbp=num(p.dbp),ldl=num(p.ldl),bmi=num(p.bmi);
  if(sbp>=150||dbp>=95)add('BP '+sbp+'/'+dbp+' (high)',.10);else if(sbp>=140||dbp>=90)add('BP '+sbp+'/'+dbp+' (elevated)',.05);
  if((cm.has('DLP')||cm.has('CVD'))&&ldl>=3.4)add('LDL '+ldl,.06);
  if(bmi>=35)add('BMI '+bmi+' (obesity II/III)',.05);else if(bmi>=30)add('BMI '+bmi+' (obesity)',.03);
  if(cm.has('CVD'))add('Established cardiovascular disease',.07);
  if(num(p.age)>=65)add('Age ≥ 65',.03);
  if(p.smoking==='current')add('Current smoker',.06);
  const adh=num(p.adherence,100);
  if(adh<50)add('Low adherence '+adh+'%',.14);else if(adh<80)add('Suboptimal adherence '+adh+'%',.07);
  if(p.type==='T1DM'){if(num(p.hypoEvents)>=2)add(p.hypoEvents+' hypo events',.10);if(p.tir!=null&&num(p.tir)<50)add('Time-in-range '+p.tir+'%',.10);}
  // MEDICATION-AWARE
  if((prot_uria||ckd)&&p.type!=='GDM'){
    if(!hasAny(ANTIPROT)){add('Proteinuria/CKD with no kidney-protective drug',.16);gap('NO_ANTIPROT',GAPS_META.NO_ANTIPROT.en);}
    else{
      if(acr>=300&&!cls.has('SGLT2I')){add('Residual macroalbuminuria, no SGLT2i',.08);gap('ADD_SGLT2I',GAPS_META.ADD_SGLT2I.en);}
      if(acr>=300&&cls.has('ACEI_ARB')&&cls.has('SGLT2I')&&!cls.has('MRA')){add('Residual albuminuria on ACEi/ARB + SGLT2i',.05);gap('FINERENONE',GAPS_META.FINERENONE.en,'MODERATE');}
    }
    if(cls.has('SGLT2I'))prot('On SGLT2i (kidney/CV protection)',.06);
    if(cls.has('ACEI_ARB'))prot('On ACEi/ARB (anti-proteinuric)',.05);
    if(cls.has('MRA'))prot('On finerenone (anti-proteinuric)',.04);
  }
  if(p.type==='T2DM'&&(cm.has('CVD')||ckd||prot_uria)&&!hasAny(ORGAN_PROT)){add('Indicated for SGLT2i/GLP-1, not prescribed',.10);gap('NO_ORGAN',GAPS_META.NO_ORGAN.en);}
  if(p.type==='T2DM'&&hba1c>=8){const gl=[...cls].filter(c=>['BIGUANIDE','SGLT2I','GLP1','DPP4','SULFONYLUREA','INSULIN'].includes(c));if(gl.length<=1){add('Above target on minimal therapy',.08);gap('INTENSIFY',GAPS_META.INTENSIFY.en);}}
  if(cls.has('BIGUANIDE')&&egfr){if(egfr<30){add('Metformin with eGFR < 30',.10);gap('METF_STOP',GAPS_META.METF_STOP.en);}else if(egfr<45){add('Metformin needs renal dose review',.05);gap('METF_DOSE',GAPS_META.METF_DOSE.en);}}
  if((cm.has('DLP')||cm.has('CVD'))&&ldl>=2.6&&!cls.has('STATIN'))gap('NO_STATIN',GAPS_META.NO_STATIN.en,'MODERATE');
  if(cm.has('HTN')&&(sbp>=140||dbp>=90)&&!cls.has('ACEI_ARB'))gap(prot_uria?'BP_OPT_ALB':'BP_OPT',(prot_uria?GAPS_META.BP_OPT_ALB:GAPS_META.BP_OPT).en,'MODERATE');
  if(p.type==='GDM'&&p.postpartumOgtt===false)gap('OGTT',GAPS_META.OGTT.en,'MODERATE');
  if(p.smoking==='current')gap('SMOKING',GAPS_META.SMOKING.en,'MODERATE');
  if(num(p.bmi)>=30)gap('WEIGHT',GAPS_META.WEIGHT.en,'MODERATE');
  for(const[k,v]of Object.entries(p.vaccinations||{}))if(v==='DUE')gap('VAX_'+k,(k==='covid19'?'COVID-19':k.charAt(0).toUpperCase()+k.slice(1))+' vaccination due','MODERATE',(VACCINES.find(x=>x[0]===k)||[,,k])[2]+' — لقاح مستحق');
  for(const[k,v]of Object.entries(p.screenings||{}))if(typeof v==='string'&&(v.startsWith('OVERDUE')||v==='NEVER')){const s=SCREENS.find(x=>x[0]===k);gap('SCREEN_'+k,(s?s[1]:k)+' overdue','MODERATE',(s?s[2]:k)+' — متأخر');}
  const raw=Math.max(0,F.reduce((s,f)=>s+f.w,0)-PR.reduce((s,f)=>s+f.w,0));
  const score=Math.max(0,Math.min(1,1-Math.exp(-raw)));
  const tier=score>=.62?'VERY_HIGH':score>=.40?'HIGH':score>=.20?'MODERATE':'STABLE';
  const trend=(vel>=.4||(egfr&&(egfrPrev-egfr)>=10))?'RISING':(vel<=-.3?'IMPROVING':'STABLE');
  F.sort((a,b)=>b.w-a.w);
  let hidden=null;
  if(egfr&&(egfrPrev-egfr)>=10&&acr>=30)hidden='Silent kidney decline: eGFR fell '+(egfrPrev-egfr).toFixed(0)+' to '+egfr+' with ACR '+acr+'.';
  else if(acr>=30&&!hasAny(ANTIPROT))hidden='Albuminuria (ACR '+acr+') without kidney-protective therapy — a commonly missed, modifiable risk.';
  else if(p.type==='GDM')hidden='Gestational diabetes confers ~7× lifetime T2DM risk — ensure postpartum follow-up.';
  else if(vel>=.4)hidden='HbA1c on an upward trajectory — intervene before it crosses into uncontrolled range.';
  return {score:+score.toFixed(2),tier,trend,factors:F.slice(0,7),protective:PR,gaps,hidden};
}

function genHistory(p){ /* backfill dated history for records that lack it */

function migrate(store){
  /* v1: bare array (jusoor_v2_panel) · v2: {panel} no version · v3: {schemaVersion:3,panel,outreach} */
  if(Array.isArray(store))store={schemaVersion:1,panel:store};
  if(!store||typeof store!=='object')return null;
  let v=store.schemaVersion||(store.panel?2:1);
  if(v<3){store.panel=(store.panel||[]).map(normalize);store.outreach=store.outreach||[];store.schemaVersion=3;}
  if(!Array.isArray(store.panel)||!store.panel.length)return null;
  store.panel=store.panel.map(normalize);
  store.outreach=Array.isArray(store.outreach)?store.outreach:[];
  return store;
}
let PANEL=[],OUTREACH=[];
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=migrate(JSON.parse(raw));if(s){OUTREACH=s.outreach;return s.panel;}}}catch(e){}
  /* one-time import from the older v2 demo if present in this browser */
  try{const old=localStorage.getItem('jusoor_v2_panel');if(old){const s=migrate(JSON.parse(old));if(s){save(s.panel);return s.panel;}}}catch(e){}

function barRow(l,v,c){return '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span>'+l+'</span><b class="mono">'+v+'%</b></div><div class="bar"><span style="width:'+Math.min(100,v)+'%;background:'+(c||'var(--pri)')+'"></span></div></div>';}
function donut(data,size){size=size||140;const total=data.reduce((s,d)=>s+d.value,0)||1;const Rr=size/2-12;const C=2*Math.PI*Rr;let off=0;
  let circles='';data.forEach(d=>{const len=d.value/total*C;circles+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+Rr+'" fill="none" stroke="'+d.color+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len;});
  let leg='';data.forEach(d=>{leg+='<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin:5px 0"><i style="width:10px;height:10px;border-radius:3px;background:'+d.color+';display:inline-block"></i><span class="muted">'+d.label+'</span><b style="margin-inline-start:auto">'+d.value+'</b></div>';});
  return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><g transform="rotate(-90 '+size/2+' '+size/2+')">'+circles+'</g><text x="50%" y="48%" text-anchor="middle" font-size="22" font-weight="750" fill="#0a4f2b">'+total+'</text><text x="50%" y="62%" text-anchor="middle" font-size="10" fill="#64786c">'+t('patients')+'</text></svg><div>'+leg+'</div></div>';}
function scored(panel){return panel.map(p=>({p,r:computeRisk(p)}));}
function stats(panel){const sc=scored(panel);const n=sc.length||1;const dist={STABLE:0,MODERATE:0,HIGH:0,VERY_HIGH:0};const types={T1DM:0,T2DM:0,GDM:0};let atT=0,gapN=0,antiprot=0,meanA1c=0;
  sc.forEach(({p,r})=>{dist[r.tier]++;types[p.type]=(types[p.type]||0)+1;if(+p.hba1c<7)atT++;gapN+=r.gaps.length;meanA1c+=+p.hba1c||0;if(r.gaps.find(g=>g.code==='NO_ANTIPROT'||g.code==='ADD_SGLT2I'))antiprot++;});
  return {n:sc.length,dist,types,atT,gapN,antiprot,meanA1c:meanA1c/n,sc};}
function daysAgo(d){return Math.round((Date.now()-new Date(d).getTime())/864e5);}
function kpi(v,l,c){return '<div class="card kpi"><div class="v"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div><div class="l">'+l+'</div></div>';}

/* SVG line chart — series:[{date,value}], target line optional */
function lineChart(series,opt){
  opt=opt||{};const W=opt.w||560,H=opt.h||170,P={t:14,r:14,b:26,l:34};
  if(!series.length)return '<div class="muted small">—</div>';
  const xs=series.map(s=>new Date(s.date).getTime());
  const ys=series.map(s=>s.value);
  let ymin=Math.min.apply(null,ys.concat(opt.target!=null?[opt.target]:[])),ymax=Math.max.apply(null,ys.concat(opt.target!=null?[opt.target]:[]));
  const pad=Math.max(.4,(ymax-ymin)*.15);ymin-=pad;ymax+=pad;
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs)||x0+1;
  const X=v=>P.l+(v-x0)/((x1-x0)||1)*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-ymin)/((ymax-ymin)||1))*(H-P.t-P.b);
  const pts=series.map(s=>X(new Date(s.date).getTime()).toFixed(1)+','+Y(s.value).toFixed(1)).join(' ');
  let g='';
  for(let i=0;i<=3;i++){const yv=ymin+(ymax-ymin)*i/3;g+='<line x1="'+P.l+'" y1="'+Y(yv).toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+Y(yv).toFixed(1)+'" stroke="#e7ece8" stroke-width="1"/><text x="'+(P.l-5)+'" y="'+(Y(yv)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#64786c">'+yv.toFixed(1)+'</text>';}
  let tgt='';if(opt.target!=null)tgt='<line x1="'+P.l+'" y1="'+Y(opt.target).toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+Y(opt.target).toFixed(1)+'" stroke="#1f9e6a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-P.r)+'" y="'+(Y(opt.target)-4).toFixed(1)+'" text-anchor="end" font-size="9" fill="#1f9e6a">'+t('target')+' '+opt.target+(opt.unit||'')+'</text>';
  const dots=series.map(s=>'<circle cx="'+X(new Date(s.date).getTime()).toFixed(1)+'" cy="'+Y(s.value).toFixed(1)+'" r="3.4" fill="'+(opt.color||'#006C35')+'"/><text x="'+X(new Date(s.date).getTime()).toFixed(1)+'" y="'+(Y(s.value)-7).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#15291e">'+s.value+(opt.unit||'')+'</text>').join('');
  const lbls=series.map((s,i)=>{if(series.length>7&&i%2)return '';const d=new Date(s.date);return '<text x="'+X(d.getTime()).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8.5" fill="#64786c">'+d.toLocaleDateString(LANG==='ar'?'ar-SA':'en-GB',{month:'short',year:'2-digit'})+'</text>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;direction:ltr">'+g+tgt+'<polyline points="'+pts+'" fill="none" stroke="'+(opt.color||'#006C35')+'" stroke-width="2.2" stroke-linejoin="round"/>'+dots+lbls+'</svg>';
}

  const oc=sc.filter(({p})=>daysAgo(p.lastContact)>=120);
  const os=sc.filter(({r})=>r.gaps.some(g=>g.code.indexOf('SCREEN_')===0));
  const escal=sc.filter(({r})=>r.tier==='VERY_HIGH');
  const pri=escal.concat(abn).filter((v,i,a)=>a.findIndex(x=>x.p.id===v.p.id)===i).sort((a,b)=>b.r.score-a.r.score).slice(0,8);

   +(pri.length?pri.map(({p,r},i)=>'<tr class="clik" onclick="openDetail(\''+p.id+'\')"><td><b>'+(i+1)+'</b></td><td><b>'+esc(dispName(p))+'</b><div class="muted small">'+p.id+'</div></td><td>'+esc(centerL(p.center))+'</td><td><span class="tag">'+p.type+'</span></td><td>'+riskChip(r.tier)+'</td><td style="max-width:220px">'+esc(r.factors[0]?r.factors[0].l:(r.hidden||'—'))+'</td><td>'+esc(r.gaps[0]?gapText(r.gaps[0]):'—')+'</td></tr>').join(''):'<tr><td colspan="7" class="muted" style="text-align:center;padding:16px">'+t('noUrgent')+'</td></tr>')

function cycleEdu(id,topic){const order=['Not started','In progress','Completed'];const p=PANEL.find(x=>x.id===id);if(!p)return;p.education=p.education||{};const cur=p.education[topic]||'Not started';p.education[topic]=order[(order.indexOf(cur)+1)%3];save();render();}
/* ====================== TEAM WORKLIST — assignable, due dates, close the loop ====================== */
function actRec(p,code){return (p.actionsLog||[]).find(a=>a.code===code);}
function buildActions(){const items=[];PANEL.forEach(p=>{const r=computeRisk(p);r.gaps.forEach(g=>{const rec=actRec(p,g.code);items.push({pid:p.id,p,code:g.code,g,sev:g.sev,status:rec&&rec.status?rec.status:'Pending',assignee:rec&&rec.assignee?rec.assignee:'',due:rec&&rec.due?rec.due:'',doneAt:rec&&rec.doneAt?rec.doneAt:''});});});return items;}
function upsertAct(pid,code,patch){const p=PANEL.find(x=>x.id===pid);if(!p)return;p.actionsLog=p.actionsLog||[];let rec=p.actionsLog.find(a=>a.code===code);if(!rec){rec={code,status:'Pending',assignee:'',due:'',at:new Date().toISOString().slice(0,10)};p.actionsLog.push(rec);}Object.assign(rec,patch);save();}
function setAssignee(pid,code,v){const p=PANEL.find(x=>x.id===pid);const rec=p?actRec(p,code):null;upsertAct(pid,code,{assignee:v,due:(rec&&rec.due)||new Date(Date.now()+7*864e5).toISOString().slice(0,10)});render();}
function setDue(pid,code,v){upsertAct(pid,code,{due:v});render();}
function advanceAction(pid,code){const it=buildActions().find(a=>a.pid===pid&&a.code===code);const N={Pending:'In progress','In progress':'Completed',Completed:'Pending'};const ns=N[it?it.status:'Pending'];upsertAct(pid,code,{status:ns,doneAt:ns==='Completed'?new Date().toISOString().slice(0,10):''});render();}
function isOverdue(it){return it.status!=='Completed'&&it.due&&it.due<new Date().toISOString().slice(0,10);}

  const items=buildActions();const today=new Date().toISOString().slice(0,10);

  const stL=s=>s==='Completed'?t('completed'):s==='In progress'?t('inProgress'):t('pending');

   +'<div class="card"><div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">'+filters.map(([k,l])=>'<button class="chip '+(f===k?'on':'')+'" onclick="STATE.actFilter=\''+k+'\';render()">'+l+'</button>').join('')+'</div>'
   +'<table><thead><tr><th>'+t('thPatient')+'</th><th>'+t('thAction')+'</th><th>'+t('thSev')+'</th><th>'+t('thAssignee')+'</th><th>'+t('thDue')+'</th><th>'+t('thStatus')+'</th><th></th></tr></thead><tbody>'
   +(shown.length?shown.map(it=>'<tr'+(isOverdue(it)?' style="background:#fdf6f5"':'')+'><td class="clik" onclick="openDetail(\''+it.pid+'\')"><b>'+esc(dispName(it.p))+'</b><div class="muted small">'+it.pid+' · '+esc(centerL(it.p.center))+'</div></td><td style="max-width:300px">'+esc(gapText(it.g))+'</td><td><span class="pill '+(it.sev==='HIGH'?'red':'amber')+'">'+it.sev+'</span></td>'
     +'<td><select class="in" style="min-width:150px;padding:5px 8px;font-size:12px" onchange="setAssignee(\''+it.pid+'\',\''+it.code+'\',this.value)">'+assOpts(it)+'</select></td>'
     +'<td><input type="date" class="in" style="padding:5px 8px;font-size:12px" value="'+it.due+'" onchange="setDue(\''+it.pid+'\',\''+it.code+'\',this.value)"/>'+(isOverdue(it)?'<div class="small" style="color:var(--red);font-weight:700">'+t('overdueF')+'</div>':'')+'</td>'
     +'<td><span class="pill '+pc(it.status)+'">'+stL(it.status)+'</span>'+(it.doneAt?'<div class="muted small">'+it.doneAt+'</div>':'')+'</td>'
     +'<td><button class="btn gho sm" onclick="advanceAction(\''+it.pid+'\',\''+it.code+'\')">'+t('advance')+'</button></td></tr>').join(''):'<tr><td colspan="7" class="muted" style="text-align:center;padding:20px">'+t('noTasks')+'</td></tr>')
   +'</tbody></table></div>';
}

  ogtt:{label:'Postpartum OGTT',labelAr:'فحص السكر بعد الولادة',cohort:'OGTT',ar:'عزيزتي {name}، حان وقت فحص السكر بعد الولادة (OGTT). نرجو حجز موعد. — جسور'}
};
function cohortCount(code){return scored(PANEL).filter(({r})=>r.gaps.some(g=>g.code===code)).length;}
function pushMsg(p,channel,tpl){OUTREACH.unshift({id:Math.random().toString(36).slice(2),pid:p.id,name:p.name,nameAr:p.nameAr,channel,template:tpl.label,templateAr:tpl.labelAr,text:tpl.ar.replace('{name}',((p.nameAr||p.name).split(' ')[0])),status:'Queued',at:new Date().toISOString().slice(0,16).replace('T',' ')});}
function sendOutreach(key,channel){const tpl=OTEMPLATES[key];const coh=scored(PANEL).filter(({r})=>tpl.cohort&&r.gaps.some(g=>g.code===tpl.cohort)).map(x=>x.p);
  if(!coh.length){alert(t('noMatch'));return;}
  coh.forEach(p=>pushMsg(p,channel,tpl));save();render();}
function sendRecallTo(pid,channel){const p=PANEL.find(x=>x.id===pid);if(!p)return;pushMsg(p,channel,OTEMPLATES.recall_general);save();render();}
function markContacted(pid){const p=PANEL.find(x=>x.id===pid);if(!p)return;p.lastContact=new Date().toISOString().slice(0,10);save();render();}

/* ====================== OUTCOMES & TRENDS — computed from dated history ====================== */
function quarterKey(d){const dt=new Date(d);return dt.getFullYear()+'-Q'+(Math.floor(dt.getMonth()/3)+1);}
function quarterSeries(filterCenter){
  const buckets={};
  PANEL.filter(p=>!filterCenter||p.center===filterCenter).forEach(p=>(p.history||[]).forEach(h=>{const k=quarterKey(h.date);(buckets[k]=buckets[k]||{sum:0,n:0,at:0,date:h.date}).sum+=h.hba1c;buckets[k].n++;if(h.hba1c<7)buckets[k].at++;if(h.date>buckets[k].date)buckets[k].date=h.date;}));
  return Object.entries(buckets).sort((a,b)=>a[0]<b[0]?-1:1).map(([k,b])=>({q:k,date:b.date,mean:+(b.sum/b.n).toFixed(2),atPct:Math.round(b.at/b.n*100),n:b.n}));
}
function riskSeriesApprox(){ /* % high+ per quarter, recomputing risk with the trend truncated to that quarter */
  const qs=quarterSeries().map(x=>x.q);
  return qs.map(q=>{let hi=0,n=0;PANEL.forEach(p=>{const hist=(p.history||[]).filter(h=>quarterKey(h.date)<=q);if(!hist.length)return;n++;const fake=Object.assign({},p,{hba1c:hist[hist.length-1].hba1c,hba1cTrend:hist.slice(-4).map(h=>h.hba1c)});const r=computeRisk(fake);if(r.tier==='HIGH'||r.tier==='VERY_HIGH')hi++;});return {q,pct:n?Math.round(hi/n*100):0};});
}
function viewTrends(){
  const qs=quarterSeries();
  const m=stats(PANEL);const n=m.n||1;
  const a1cSeries=qs.map(x=>({date:x.date,value:x.mean}));
  const atSeries=qs.map(x=>({date:x.date,value:x.atPct}));
  const hiQ=riskSeriesApprox();
  const hiSeries=hiQ.map((x,i)=>({date:(qs[i]||{}).date||new Date().toISOString().slice(0,10),value:x.pct}));
  let byCenter='<div class="grid g2" style="margin-top:16px">';
  CENTERS.forEach((c,i)=>{const s=quarterSeries(c).map(x=>({date:x.date,value:x.mean}));byCenter+='<div class="card"><div class="sect-t">'+esc(centerL(c))+'</div>'+lineChart(s,{target:7,unit:'%',color:['#006C35','#0e8a47','#1f9e8f','#1c3a6e','#b99441'][i],h:150})+'</div>';});
  byCenter+='</div>';
  return pagehead(t('trTitle'),t('trSub'))
   +'<div class="grid g2" style="margin-bottom:0">'
   +'<div class="card"><div class="sect-t">'+t('trA1c')+'</div>'+lineChart(a1cSeries,{target:7,unit:'%'})+'</div>'
   +'<div class="card"><div class="sect-t">'+t('trAt')+'</div>'+lineChart(atSeries,{unit:'%',color:'#1f9e6a'})+'</div>'
   +'<div class="card"><div class="sect-t">'+t('trHi')+'</div>'+lineChart(hiSeries,{unit:'%',color:'#cf4438'})+'</div>'
   +'<div class="card"><div class="sect-t">'+t('riskToday')+'</div>'+barRow(t('stable'),Math.round(m.dist.STABLE/n*100),'var(--green)')+barRow(t('moderate'),Math.round(m.dist.MODERATE/n*100),'#f0d27a')+barRow(t('high'),Math.round(m.dist.HIGH/n*100),'var(--amber)')+barRow(t('veryHigh'),Math.round(m.dist.VERY_HIGH/n*100),'var(--red)')+'</div>'
   +'</div>'
   +'<div class="card" style="margin-top:16px"><div class="sect-t">'+t('trByCenter')+'</div><p class="muted small" style="margin:0 0 6px">'+t('trNote')+'</p></div>'
   +byCenter;
}

/* ====================== DETAIL MODAL ====================== */
function openDetail(id){STATE.selected=id;renderModal(detailHtml(id));}
function detailHtml(id){
  const p=PANEL.find(x=>x.id===id);if(!p)return '';const r=computeRisk(p);
  let meds=(p.meds||[]).length?(p.meds||[]).map(m=>'<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>💊 '+esc(m.name)+'</span><span class="tag">'+(MED_CLASS[m.cls]||m.cls)+'</span></div>').join(''):'<div class="muted small">'+t('noMeds')+'</div>';
  let gaps=r.gaps.length?r.gaps.map(g=>'<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span class="flag" style="margin:0">⚠</span> '+esc(gapText(g))+'</div>').join(''):'<span class="flag ok">'+t('noGaps')+'</span>';
  let screen=p.type==='GDM'?'':'<div class="card"><div class="sect-t">'+t('screening')+'</div>'+SCREENS.map(s=>{const v=(p.screenings||{})[s[0]]||'NA';const od=typeof v==='string'&&(v.startsWith('OVERDUE')||v==='NEVER');const dn=v==='DONE';return '<div class="between" style="padding:5px 0;font-size:13px"><span>'+screenL(s)+'</span><span class="pill '+(dn?'green':od?'red':'amber')+'">'+(dn?t('done'):od?(LANG==='ar'?t('overdue'):v.replace('_',' ')):t('due'))+'</span></div>';}).join('')+'</div>';
  const smokeL={never:t('neverS'),former:t('formerS'),current:t('currentS')};
  let prev='<div class="card"><div class="sect-t">'+t('prevention')+'</div><div class="between" style="padding:5px 0;font-size:13px"><span>'+t('smoking')+'</span><span class="pill '+(p.smoking==='current'?'red':p.smoking==='former'?'amber':'green')+'">'+(smokeL[p.smoking]||'—')+'</span></div>'+Object.entries(p.vaccinations||{}).map(([k,v])=>{const vac=VACCINES.find(x=>x[0]===k);return '<div class="between" style="padding:5px 0;font-size:13px"><span>'+(vac?(LANG==='ar'?vac[2]:vac[1]):k)+' '+t('vaccine')+'</span><span class="pill '+(v==='DONE'?'green':'amber')+'">'+(v==='DONE'?t('done'):t('due'))+'</span></div>';}).join('')+'</div>';
  const histSeries=(p.history||[]).map(h=>({date:h.date,value:h.hba1c}));
  return '<div class="modal"><div class="mhead"><div><h2>'+esc(dispName(p))+' <span style="opacity:.7;font-size:14px">'+esc(altName(p))+'</span></h2><div style="opacity:.85;font-size:12.5px;margin-top:3px">'+p.id+' · '+p.mrn+' · '+p.age+'/'+p.sex+' · '+p.type+' · '+esc(centerL(p.center))+'</div><div style="margin-top:9px;display:flex;gap:8px">'+riskChip(r.tier)+trendChip(r.trend)+'</div></div><button class="x" onclick="closeModal()">✕</button></div>'
   +'<div class="mbody"><div class="ai"><div class="h">🧠 '+t('clinSummary')+'</div><ul><li><b>'+t('control')+':</b> HbA1c '+p.hba1c+'% ('+r.trend.toLowerCase()+'); ACR '+p.acr+'; eGFR '+(p.egfr==null?'—':p.egfr)+'.</li>'+(r.hidden?'<li><b>'+t('hiddenRisk')+':</b> '+esc(r.hidden)+'</li>':'')+'<li><b>'+t('topAction')+':</b> '+esc(r.gaps[0]?gapText(r.gaps[0]):t('contPlan'))+'</li></ul></div>'
   +'<div class="card" style="margin-top:14px"><div class="sect-t">🏠 '+t('home')+'</div><table><tbody><tr><td>'+t('thCenter')+'</td><td><b>'+esc(centerL(p.center))+'</b></td><td>'+t('physicianL')+'</td><td>'+esc(p.physician||'—')+'</td></tr><tr><td>'+t('coordinator')+'</td><td>'+esc(p.coordinator||'—')+'</td><td>'+t('comorbid')+'</td><td>'+((p.comorbidities||[]).join(', ')||t('none'))+'</td></tr></tbody></table></div>'
   +'<div class="card" style="margin-top:14px"><div class="sect-t">'+t('a1cHistory')+'</div>'+lineChart(histSeries,{target:7,unit:'%',h:180})+'</div>'
   +'<div class="grid g2" style="margin-top:14px"><div class="card"><div class="sect-t">'+t('regValues')+'</div><table><tbody><tr><td>HbA1c</td><td>'+a1cChip(p.hba1c)+'</td><td>'+t('adherence')+'</td><td class="mono">'+p.adherence+'%</td></tr><tr><td>ACR</td><td class="mono">'+p.acr+'</td><td>eGFR</td><td class="mono">'+(p.egfr==null?'—':p.egfr)+'</td></tr><tr><td>BP</td><td class="mono">'+(p.sbp?p.sbp+'/'+p.dbp:'—')+'</td><td>LDL</td><td class="mono">'+(p.ldl==null?'—':p.ldl)+'</td></tr><tr><td>BMI</td><td class="mono">'+(p.bmi==null?'—':p.bmi)+'</td><td>'+(p.type==='T1DM'?'TIR':'—')+'</td><td class="mono">'+(p.type==='T1DM'?(p.tir!=null?p.tir+'%':'—'):'')+'</td></tr></tbody></table></div>'
   +'<div class="card"><div class="sect-t">'+t('medications')+'</div>'+meds+'<div class="sect-t" style="margin-top:12px">'+t('gapsOpt')+'</div>'+gaps+'</div></div>'

   +'</div><div class="mfoot"><span class="muted small">'+t('decision')+'</span><button class="btn gho" onclick="closeModal()">'+t('close')+'</button></div></div>';
}

/* ====================== ENROL MODAL (reactive live risk) ====================== */
let FORM=null;
function blankForm(){return {name:'',mrn:'',age:'',sex:'',bmi:'',center:'',physician:'',coordinator:'',type:'T2DM',comorbidities:[],hba1c:'',acr:'',egfr:'',sbp:'',dbp:'',ldl:'',adherence:70,tir:'',hypoEvents:0,postpartumOgtt:false,retinal:'DUE',smoking:'never',vaccinations:{influenza:'DUE',covid19:'DUE',pneumococcal:'DUE'},meds:[]};}
function openEnrol(){FORM=blankForm();renderModal(enrolHtml());}
function fset(k,v){FORM[k]=v;updateEnrol();}
function ftoggle(k,v){const a=FORM[k];FORM[k]=a.includes(v)?a.filter(x=>x!==v):a.concat([v]);renderModal(enrolHtml());}
function ftoggleMed(name,cls){const i=FORM.meds.findIndex(m=>m.name===name);if(i>=0)FORM.meds.splice(i,1);else FORM.meds.push({name,cls});updateEnrol();}
function fvax(k,v){FORM.vaccinations[k]=v;updateEnrol();}
function liveRisk(){return computeRisk(Object.assign({},FORM,{hba1cTrend:FORM.hba1c?[parseFloat(FORM.hba1c)]:[]}));}
function updateEnrol(){const el=document.getElementById('liveRisk');if(el)el.innerHTML=liveRiskHtml();const sv=document.getElementById('saveBtn');if(sv)sv.disabled=!(FORM.name&&FORM.age&&FORM.sex&&FORM.center&&FORM.hba1c);}
function liveRiskHtml(){const r=liveRisk();let h='<div class="between"><div style="display:flex;align-items:center;gap:12px">'+riskChip(r.tier)+'<span class="muted small">'+t('detScore')+' '+Math.round(r.score*100)+'% · '+(r.tier==='STABLE'?t('okRange'):t('needsAtt'))+'</span></div></div>';
  if(r.factors.length)h+='<div style="margin-top:10px">'+r.factors.map(x=>'<span class="flag warn">'+esc(x.l)+'</span>').join('')+'</div>';
  if(r.protective.length)h+='<div style="margin-top:4px">'+r.protective.map(x=>'<span class="flag ok">✓ '+esc(x.l)+'</span>').join('')+'</div>';
  if(r.gaps.length)h+='<div style="margin-top:8px"><div class="muted small" style="font-weight:700;margin-bottom:4px">'+t('recActions')+'</div>'+r.gaps.map(g=>'<span class="flag">⚠ '+esc(gapText(g))+'</span>').join('')+'</div>';
  return h;}

  +'<div class="mfoot"><span class="muted small">'+t('enFoot')+'</span><div style="display:flex;gap:8px"><button class="btn gho" onclick="closeModal()">'+t('cancel')+'</button><button class="btn pri" id="saveBtn" '+((FORM.name&&FORM.age&&FORM.sex&&FORM.center&&FORM.hba1c)?'':'disabled')+' onclick="saveEnrol()">'+t('enrolSave')+'</button></div></div></div>';
}
function saveEnrol(){const f=FORM;const today=new Date().toISOString().slice(0,10);const p=normalize(Object.assign({},f,{
  id:'P-'+Math.floor(1000+Math.random()*9000),mrn:f.mrn||('MRN'+Math.floor(50000+Math.random()*9999)),
  hba1cTrend:[parseFloat(f.hba1c)],history:[{date:today,hba1c:parseFloat(f.hba1c)}],egfrPrev:f.egfr,
  screenings:f.type==='GDM'?{egfr:'DONE',acr:'DONE'}:{retinal:f.retinal,foot:'DUE',neuropathy:'DUE',egfr:'DONE',acr:'DONE',lipid:'DUE'},
  education:{},lastContact:today,createdAt:Date.now()}),0);
  PANEL.unshift(p);save();closeModal();STATE.tab='registry';render();}

/* ====================== MODAL PLUMBING / BOOT ====================== */
function renderModal(html){$('#modalRoot').innerHTML=html?'<div class="overlay" onclick="if(event.target===this)closeModal()">'+html+'</div>':'';}
function closeModal(){$('#modalRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function boot(){PANEL=load();$('#loginRoot').innerHTML='';$('#shell').classList.remove('hidden');applyLang();render();}
SESSION=loadSession();
if(SESSION)boot();else renderLogin();
</script>
</body>
